<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf5ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101712" media="(prefers-color-scheme: dark)">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title == "ChineseEcho" %}ChineseEcho — Listen. Learn. Remember.{% else %}{{ page.title }} · ChineseEcho{% endif %}</title>
    <link rel="icon" href="{{ '/assets/images/chineseecho-app-icon.png' | relative_url }}">
    <script>
      // Apply a saved theme before first paint so forced light/dark never flashes.
      try { const savedTheme = localStorage.getItem("chineseecho-theme"); if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme; } catch {}
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body class="{% if page.url == '/' %}home-page{% else %}content-page{% endif %}{% if page.wide %} wide-page{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="ChineseEcho home"{% if page.url == '/' %} aria-current="page"{% endif %}>
          <img class="brand-mark" src="{{ '/assets/images/chineseecho-app-icon.png' | relative_url }}" alt="" width="256" height="256">
          <span class="brand-copy"><strong>ChineseEcho</strong><span>Listen. Learn. Remember.</span></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
          <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
          <a href="{{ '/release-notes-1.0/' | relative_url }}"{% if page.url == '/release-notes-1.0/' %} aria-current="page"{% endif %}>Release notes</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="site-main">{{ content }}</main>
    <footer class="site-footer">
      <div class="footer-inner">
        <div><a class="footer-brand" href="{{ '/' | relative_url }}">ChineseEcho</a><p>A private Chinese-learning workspace for macOS.</p></div>
        <nav aria-label="Footer navigation">
          <a href="{{ '/support/' | relative_url }}">Support</a>
          <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
          <a href="{{ '/acknowledgements/' | relative_url }}">Licenses</a>
          <a href="https://github.com/avarzhou-ctrl/ChineseEcho">GitHub</a>
        </nav>
        <p class="footer-note">Local-first by design. No accounts, ads, or tracking.</p>
      </div>
    </footer>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </body>
</html>
